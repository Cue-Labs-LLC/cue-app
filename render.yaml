services:
  # Web service
  - type: web
    name: ltv-updater
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput && python manage.py create_initial_superuser
    startCommand: gunicorn ltv_updater.wsgi:application --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: ALLOWED_HOSTS
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_STORAGE_BUCKET_NAME
        sync: false
      - key: AWS_S3_REGION_NAME
        value: us-east-1
      - key: AWS_S3_CUSTOM_DOMAIN
        sync: false
      # DATABASE_URL is manually set in Render dashboard to point to your manually created database
      - key: DATABASE_URL
        sync: false  # This tells Render not to auto-generate it
      - key: CELERY_BROKER_URL
        fromService:
          name: ltv-updater-redis
          type: redis
          property: connectionString
    healthCheckPath: /health/

  # Redis for Celery broker (schema requires ipAllowList)
  - type: redis
    name: ltv-updater-redis
    plan: starter
    maxmemoryPolicy: noeviction
    ipAllowList:
      - source: 0.0.0.0/0
        description: Allow web and worker services to connect

  # Celery background worker
  - type: worker
    name: ltv-updater-worker
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A ltv_updater worker --loglevel=info --concurrency=2
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CELERY_BROKER_URL
        fromService:
          name: ltv-updater-redis
          type: redis
          property: connectionString