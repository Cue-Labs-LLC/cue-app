services:
  # ----------------------------------------------------------------------
  # PRODUCTION — deploys from `main`
  # ----------------------------------------------------------------------

  # Web service
  - type: web
    name: ltv-updater
    runtime: python
    plan: standard
    branch: main
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput && python manage.py create_initial_superuser
    startCommand: gunicorn ltv_updater.wsgi:application --workers 4 --threads 2 --worker-class gthread --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DJANGO_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: ALLOWED_HOSTS
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_STORAGE_BUCKET_NAME
        sync: false
      - key: AWS_S3_REGION_NAME
        value: us-east-1
      - key: AWS_S3_CUSTOM_DOMAIN
        sync: false
      # DATABASE_URL is manually set in Render dashboard to point to your manually created database
      - key: DATABASE_URL
        sync: false  # This tells Render not to auto-generate it
      - key: CELERY_BROKER_URL
        fromService:
          name: ltv-updater-redis
          type: redis
          property: connectionString
      - key: SENDGRID_API_KEY
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: SITE_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_CURRENCY
        value: usd
      # Apple Push Notifications (APNs). The push SEND runs on the worker; these
      # live here too so the device-token endpoint + account.updated webhook are
      # consistent. Paste the .p8 contents into APNS_AUTH_KEY as a Render secret.
      # APNS_USE_SANDBOX=false targets the production APNs host (App Store /
      # TestFlight builds); "true" targets the sandbox host (dev builds).
      - key: APNS_KEY_ID
        sync: false
      - key: APNS_TEAM_ID
        value: X6TZEUAVYR
      - key: APNS_BUNDLE_ID
        value: co.cueup.cue
      - key: APNS_AUTH_KEY
        sync: false
      - key: APNS_USE_SANDBOX
        value: "false"
    healthCheckPath: /health/

  # Redis for Celery broker (schema requires ipAllowList)
  - type: redis
    name: ltv-updater-redis
    plan: standard
    maxmemoryPolicy: noeviction
    ipAllowList:
      - source: 0.0.0.0/0
        description: Allow web and worker services to connect

  # Celery background worker (sends invite emails, OTP, surveys, etc.).
  # Set SENDGRID_API_KEY, DEFAULT_FROM_EMAIL (must be a verified sender in SendGrid), and SITE_URL (e.g. https://your-app.onrender.com) in the Render dashboard for this service so emails are sent and links point to your deployed app.
  - type: worker
    name: ltv-updater-worker
    runtime: python
    plan: standard
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A ltv_updater worker --loglevel=info --concurrency=2
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DJANGO_ENV
        value: production
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CELERY_BROKER_URL
        fromService:
          name: ltv-updater-redis
          type: redis
          property: connectionString
      - key: SENDGRID_API_KEY
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: SITE_URL
        sync: false
      # Marketing SMS sending happens on the worker, so it needs Twilio creds +
      # the Messaging Service that holds the verified sender number.
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      # Set TWILIO_MESSAGING_SERVICE_SID (preferred) OR TWILIO_SMS_FROM.
      - key: TWILIO_MESSAGING_SERVICE_SID
        sync: false
      - key: TWILIO_SMS_FROM
        sync: false
      # Apple Push Notifications (APNs). The push send runs here
      # (send_push_notification_task + the send_launch_push broadcast), so the
      # worker needs the credentials. Paste the .p8 contents into APNS_AUTH_KEY
      # as a Render secret. APNS_USE_SANDBOX=false for App Store / TestFlight
      # builds; "true" for dev builds (device tokens are environment-specific).
      - key: APNS_KEY_ID
        sync: false
      - key: APNS_TEAM_ID
        value: X6TZEUAVYR
      - key: APNS_BUNDLE_ID
        value: co.cueup.cue
      - key: APNS_AUTH_KEY
        sync: false
      - key: APNS_USE_SANDBOX
        value: "false"

  # Daily AI opportunity scan. Enqueues one Celery task per organization.
  - type: cron
    name: ltv-updater-ai-opportunities
    runtime: python
    schedule: "0 9 * * *"
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py generate_ai_opportunities
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DJANGO_ENV
        value: production
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CELERY_BROKER_URL
        fromService:
          name: ltv-updater-redis
          type: redis
          property: connectionString

  # Daily AI event-summary refresh. Enqueues one Celery task per candidate event;
  # each task regenerates the summary only if the event ended and its underlying
  # data changed since the last generation. 14:00 UTC = 6:00 AM PST (Render cron is
  # UTC-only and doesn't observe DST, so this lands at 7:00 AM during PDT).
  - type: cron
    name: cue-event-summary-regenerator
    runtime: python
    schedule: "0 14 * * *"
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py regenerate_event_summaries
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DJANGO_ENV
        value: production
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CELERY_BROKER_URL
        fromService:
          name: ltv-updater-redis
          type: redis
          property: connectionString

  # Marketing SMS scheduler. Every 5 min: dispatch due scheduled campaigns and
  # recover any stuck mid-send. Only enqueues Celery tasks (sending runs on the
  # worker), so it needs DB + broker but not Twilio creds.
  - type: cron
    name: ltv-updater-sms-scheduler
    runtime: python
    schedule: "*/5 * * * *"
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py send_due_sms_campaigns
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DJANGO_ENV
        value: production
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CELERY_BROKER_URL
        fromService:
          name: ltv-updater-redis
          type: redis
          property: connectionString

  # Post-event survey scheduler. Every 5 min: dispatch survey invitations whose
  # relative-to-event-end send time has arrived. Only enqueues Celery tasks
  # (sending runs on the worker), so it needs DB + broker.
  - type: cron
    name: cue-survey-scheduler
    runtime: python
    schedule: "*/5 * * * *"
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py send_due_survey_invitations
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DJANGO_ENV
        value: production
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CELERY_BROKER_URL
        fromService:
          name: ltv-updater-redis
          type: redis
          property: connectionString

