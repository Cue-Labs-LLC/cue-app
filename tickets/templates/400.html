<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>400 · Cue</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%230F0E0D'/%3E%3Cpath d='M6 11a1 1 0 0 1 1-1h18a1 1 0 0 1 1 1v3a2 2 0 0 0 0 4v3a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1v-3a2 2 0 0 0 0-4v-3z' fill='%2300FF87'/%3E%3Cline x1='13' y1='10' x2='13' y2='22' stroke='%230F0E0D' stroke-width='1.5' stroke-dasharray='2 2'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,900;1,900&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" as="style" onload="this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,900;1,900&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap"></noscript>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg:          #0F0E0D;
            --surface:     #191817;
            --border:      rgba(255,255,255,0.07);
            --border-mid:  rgba(255,255,255,0.11);
            --text:        #EDE8E3;
            --text-2:      #7A7672;
            --text-3:      #4A4846;
            --accent:      #00FF87;
            --font-display:'Barlow Condensed', 'Arial Narrow', sans-serif;
            --font-body:   'DM Sans', system-ui, sans-serif;
        }

        html, body { height: 100%; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--font-body);
            font-weight: 300;
            -webkit-font-smoothing: antialiased;
            display: flex;
            flex-direction: column;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: var(--accent);
            box-shadow: 0 0 10px rgba(0,255,135,0.28);
            z-index: 100;
        }

        .e-nav {
            display: flex;
            align-items: center;
            padding: 0 clamp(20px, 4vw, 48px);
            height: 54px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            margin-top: 2px;
        }

        .e-brand {
            display: flex;
            align-items: center;
            gap: 9px;
            text-decoration: none;
            color: var(--text);
        }
        .e-brand-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--accent);
            flex-shrink: 0;
            box-shadow: 0 0 8px rgba(0,255,135,0.22);
        }
        .e-brand-name {
            font-family: var(--font-display);
            font-weight: 900;
            font-size: 1.5rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            line-height: 1;
        }

        .e-main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: clamp(32px, 6vh, 80px) clamp(20px, 4vw, 48px);
            position: relative;
            overflow: hidden;
        }

        .e-ghost {
            position: absolute;
            font-family: var(--font-display);
            font-weight: 900;
            font-style: italic;
            font-size: clamp(220px, 36vw, 480px);
            color: rgba(255,255,255,0.025);
            letter-spacing: -0.04em;
            user-select: none;
            pointer-events: none;
            line-height: 0.85;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            opacity: 0;
            animation: ghost-in 1s ease 0.1s forwards;
        }

        @keyframes ghost-in {
            from { opacity: 0; filter: blur(6px); }
            to   { opacity: 1; filter: blur(0); }
        }

        .e-content {
            position: relative;
            max-width: 480px;
            width: 100%;
            opacity: 0;
            animation: content-up 0.45s ease 0.05s forwards;
        }

        @keyframes content-up {
            from { opacity: 0; transform: translateY(18px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .e-code {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.68rem;
            font-weight: 400;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--text-3);
            margin-bottom: 20px;
        }
        .e-code::before {
            content: '';
            display: block;
            width: 22px;
            height: 1px;
            background: var(--text-3);
            flex-shrink: 0;
        }

        .e-title {
            font-size: clamp(1.8rem, 4vw, 2.4rem);
            font-weight: 500;
            letter-spacing: -0.025em;
            line-height: 1.15;
            color: var(--text);
            margin-bottom: 14px;
        }

        .e-body {
            font-size: 0.9rem;
            color: var(--text-2);
            line-height: 1.7;
            margin-bottom: 36px;
        }

        .e-actions { display: flex; gap: 10px; flex-wrap: wrap; }

        .e-btn {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            font-size: 0.72rem;
            font-weight: 400;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            text-decoration: none;
            padding: 10px 20px;
            min-height: 44px;
            border-radius: 3px;
            border: 1px solid transparent;
            cursor: pointer;
            transition: opacity 0.15s, transform 0.1s;
            background: none;
        }
        .e-btn:active { transform: scale(0.98); }

        .e-btn--primary {
            background: var(--text);
            border-color: var(--text);
            color: var(--bg);
        }
        .e-btn--primary:hover { opacity: 0.86; }

        .e-btn--ghost {
            border-color: var(--border-mid);
            color: var(--text-2);
        }
        .e-btn--ghost:hover { color: var(--text); border-color: rgba(255,255,255,0.2); }
    </style>
</head>
<body>

<nav class="e-nav">
    <a href="/" class="e-brand" aria-label="Go to Cue homepage">
        <span class="e-brand-dot"></span>
        <span class="e-brand-name">Cue</span>
    </a>
</nav>

<main class="e-main">
    <span class="e-ghost">400</span>
    <div class="e-content">
        <p class="e-code">Error 400</p>
        <h1 class="e-title">Bad request</h1>
        <p class="e-body">The server couldn't process this request. It may have been malformed or is missing required information. Go back and try again.</p>
        <div class="e-actions">
            <a href="javascript:history.back()" class="e-btn e-btn--primary">Go back</a>
            <a href="/" class="e-btn e-btn--ghost">Go to dashboard</a>
        </div>
    </div>
</main>

</body>
</html>
