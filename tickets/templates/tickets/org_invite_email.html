<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
</head>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: #f5f5f5; margin: 0; padding: 20px;">
    <div style="max-width: 480px; margin: 0 auto; background: #ffffff; border-radius: 8px; padding: 40px; text-align: center;">
        <h2 style="margin: 0 0 8px; color: #1a1a2e;">Cue</h2>
        <p style="color: #666; margin: 0 0 32px;">Organization invitation</p>

        <p style="color: #333; margin: 0 0 24px;">You've been invited to join <strong>{{ organization_name }}</strong> on Cue.</p>
        <p style="color: #666; margin: 0 0 24px; font-size: 14px;">Click below to accept and start collaborating.</p>

        <a href="{{ accept_url }}"
           style="display: inline-block; background: #1a1a2e; color: #ffffff; text-decoration: none; padding: 14px 32px; border-radius: 6px; font-weight: 600; font-size: 16px;">
            Accept invitation
        </a>

        <p style="color: #999; font-size: 13px; margin: 32px 0 0;">
            If the button doesn't work, copy and paste this link into your browser:<br>
            <a href="{{ accept_url }}" style="color: #666;">{{ accept_url }}</a>
        </p>
    </div>
</body>
</html>
