{% extends 'tickets/base.html' %}

{% block title %}My Tickets - Eventflow{% endblock %}

{% block content %}
<div class="page-header">
    <h1>My Tickets</h1>
</div>

<div class="empty-state">
    <i class="bi bi-ticket-perforated" style="font-size: 2.5rem; opacity: 0.4;"></i>

</div>
{% endblock %}
