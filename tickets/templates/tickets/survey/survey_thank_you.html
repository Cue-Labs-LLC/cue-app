<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23EDE8E3'/%3E%3Cpath d='M10 16l4 4 8-8' stroke='%230F0E0D' stroke-width='3' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E">
    <title>Thank You - Cue</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" as="style" onload="this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"></noscript>
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap" as="style" onload="this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap"></noscript>
    <style>
        :root {
            --bg:            #0F0E0D;
            --surface:       #191817;
            --surface-2:     #232220;
            --cta:           #EDE8E3;
            --text:          #EDE8E3;
            --text-2:        #9E9A96;
            --text-3:        #4A4846;
            --danger:        #D97060;
            --success:       #6A9E7F;
            --border:        rgba(255,255,255,0.07);
            --border-mid:    rgba(255,255,255,0.11);
            --font-display:  'Syne', system-ui, sans-serif;
            --font-body:     'DM Sans', system-ui, sans-serif;
            --font-mono:     'DM Mono', 'Courier New', monospace;
            --radius:        3px;
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--text); font-family: var(--font-body); font-weight: 300; -webkit-font-smoothing: antialiased; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .card {
            background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
            max-width: 440px; width: 100%; padding: 48px 36px; text-align: center;
            animation: fadeUp 0.4s ease both;
        }
        .icon { font-size: 2.5rem; color: var(--success); margin-bottom: 20px; opacity: 0.85; }
        h1 { font-family: var(--font-display); font-weight: 800; font-size: 1.5rem; letter-spacing: -0.03em; margin-bottom: 10px; }
        p { color: var(--text-2); font-size: 0.9rem; line-height: 1.6; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon"><i class="bi bi-check-circle-fill"></i></div>
        <h1>Thank you.</h1>
        <p>Your response has been recorded. We appreciate you taking the time to share your thoughts.</p>
    </div>
</body>
</html>
