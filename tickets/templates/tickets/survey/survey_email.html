<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@900&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap">
</head>
<body style="margin: 0; padding: 0; background-color: #0F0E0D;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" bgcolor="#0F0E0D" style="background-color: #0F0E0D; padding: 28px 12px;">
        <tr>
            <td align="center">
                <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="max-width: 480px; width: 100%; background: #191817; border: 1px solid rgba(255,255,255,0.11); border-radius: 3px;">
                    <tr>
                        <td style="padding: 44px 40px; text-align: center; font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">

                            <!-- Sender wordmark (organizer when opted in, else Cue) -->
                            <div style="margin: 0 0 32px; line-height: 1;">
                                <span style="font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 900; font-size: 24px; letter-spacing: 0.05em; text-transform: uppercase; color: #FFFFFF;">{{ sender_name|default:"Cue" }}</span>
                            </div>

                            <h1 style="margin: 0 0 8px; color: #FFFFFF; font-size: 24px; font-weight: 700; letter-spacing: -0.02em;">How was {{ event.name }}?</h1>
                            <p style="color: #C8C5C1; margin: 0 0 28px; font-size: 14px;">{{ event.start_date|date:"F j, Y" }}{% if event.venue %} at {{ event.venue.name }}, {{ event.venue.city }}{% endif %}</p>

                            <p style="color: #E8E6E3; margin: 0 0 28px; font-size: 15px; line-height: 1.55;">We'd love to hear your thoughts. It only takes a minute!</p>

                            <a href="{{ survey_url }}"
                               style="display: inline-block; background: #00FF87; color: #0F0E0D; text-decoration: none; padding: 15px 36px; border-radius: 3px; font-family: 'DM Sans', -apple-system, sans-serif; font-weight: 700; font-size: 15px; letter-spacing: -0.01em;">
                                Share Your Feedback
                            </a>

                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
