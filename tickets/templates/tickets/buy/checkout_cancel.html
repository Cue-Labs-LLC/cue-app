<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Canceled</title>
    <link rel="preload" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" as="style" onload="this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"></noscript>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" as="style" onload="this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap"></noscript>
    <style>
        :root {
            --bg:            #0F0E0D;
            --surface:       #191817;
            --surface-2:     #232220;
            --cta:           #EDE8E3;
            --text:          #EDE8E3;
            --text-2:        #7A7672;
            --text-3:        #4A4846;
            --danger:        #D97060;
            --success:       #6A9E7F;
            --border:        rgba(255,255,255,0.07);
            --border-mid:    rgba(255,255,255,0.11);
            --border-strong: rgba(255,255,255,0.16);
            --font-display:  'Syne', system-ui, sans-serif;
            --font-body:     'DM Sans', system-ui, sans-serif;
            --font-mono:     'DM Sans', system-ui, sans-serif;
            --radius:        3px;
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--text); font-family: var(--font-body); font-weight: 300; -webkit-font-smoothing: antialiased; }
        .page { max-width: 480px; margin: 0 auto; padding: 80px 20px; text-align: center; animation: fadeUp 0.4s ease both; }
        .icon { font-size: 2.75rem; color: var(--text-3); margin-bottom: 22px; }
        h1 { font-family: var(--font-display); font-weight: 800; font-size: 1.75rem; letter-spacing: -0.03em; margin-bottom: 10px; }
        p { color: var(--text-2); margin-bottom: 32px; font-size: 0.95rem; line-height: 1.6; }
        .btn-back {
            display: inline-flex; align-items: center; gap: 7px;
            background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
            padding: 12px 20px; font-family: var(--font-mono); font-size: 0.75rem;
            letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-2);
            text-decoration: none; cursor: pointer; transition: border-color 0.15s, color 0.15s;
        }
        .btn-back:hover { border-color: rgba(255,255,255,0.16); color: var(--text); }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    </style>
</head>
<body>
<div class="page">
    <div class="icon"><i class="bi bi-x-circle"></i></div>
    <h1>Order Canceled</h1>
    <p>You didn't complete checkout. No payment has been taken.</p>
    <a href="javascript:history.back()" class="btn-back">
        <i class="bi bi-arrow-left"></i> Go Back
    </a>
</div>
</body>
</html>
