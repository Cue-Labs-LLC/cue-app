<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Canceled</title>
    <link rel="preload" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" as="style" onload="this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"></noscript>
    <link rel="preload" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" as="style" onload="this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"></noscript>
    <style>
        body { background: #f5f7fa; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        .cancel-container { max-width: 480px; margin: 80px auto; padding: 0 16px; text-align: center; }
        .cancel-icon { font-size: 3.5rem; color: #6c757d; margin-bottom: 16px; }
        .cancel-title { font-size: 1.5rem; font-weight: 700; color: #1a1a2e; margin-bottom: 8px; }
        .cancel-sub { color: #666; margin-bottom: 32px; }
    </style>
</head>
<body>
<div class="cancel-container">
    <div class="cancel-icon"><i class="bi bi-x-circle"></i></div>
    <div class="cancel-title">Order Canceled</div>
    <p class="cancel-sub">You didn't complete checkout. No payment has been taken.</p>
    <a href="javascript:history.back()" class="btn btn-outline-secondary">
        <i class="bi bi-arrow-left"></i> Go Back
    </a>
</div>
</body>
</html>
