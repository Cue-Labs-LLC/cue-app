<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ event.name }} — Ticket Sales Ended</title>
    <link rel="preload" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" as="style" onload="this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"></noscript>
    <link rel="preload" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" as="style" onload="this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"></noscript>
    <style>
        body { background: #f5f7fa; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        .buy-container { max-width: 600px; margin: 40px auto; padding: 0 16px 60px; }
        .buy-header { text-align: center; margin-bottom: 32px; }
        .buy-header h1 { font-size: 1.6rem; font-weight: 700; color: #1a1a2e; margin-bottom: 4px; }
        .buy-header p { color: #666; margin: 0; }
    </style>
</head>
<body>
<div class="buy-container">
    <div class="buy-header">
        <h1>{{ event.name }}</h1>
        <p>
            {{ event.start_date }}
            {% if event.venue %}— {{ event.venue.name }}{% if event.venue.city %}, {{ event.venue.city }}{% endif %}{% endif %}
        </p>
    </div>
    <div class="card text-center py-5">
        <div class="card-body">
            <i class="bi bi-stop-circle" style="font-size: 3rem; color: #6c757d;"></i>
            <h4 class="mt-3 mb-2">Ticket Sales Have Ended</h4>
            <p class="text-muted mb-0">Tickets are no longer available for this event.</p>
        </div>
    </div>
</div>
</body>
</html>
