{% extends 'tickets/base.html' %}
{% load crispy_forms_tags %}

{% block title %}{{ action }} Income Source{% endblock %}

{% block content %}
<nav aria-label="breadcrumb">
    <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="{% url 'tickets:home' %}">Dashboard</a></li>
        <li class="breadcrumb-item"><a href="{% url 'tickets:income_source_list' %}">Income Sources</a></li>
        <li class="breadcrumb-item active">{{ action }}</li>
    </ol>
</nav>

<div class="page-header">
    <h1>{{ action }} Income Source</h1>
</div>

<div class="row">
    <div class="col-md-6">
        <div class="card">
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    {% crispy form %}
                </form>
            </div>
        </div>
        <div class="d-flex gap-2 mt-3">
            <a href="{% url 'tickets:income_source_list' %}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left"></i> Back to Income Sources</a>
        </div>
    </div>
</div>
{% endblock %}
