{% extends 'tickets/base.html' %}
{% load crispy_forms_tags %}

{% block title %}Create organization{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0">Create organization</h5>
            </div>
            <div class="card-body">
                <p class="text-muted small">Create an organization to start using the app. You will be the first member.</p>
                {% crispy form %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
