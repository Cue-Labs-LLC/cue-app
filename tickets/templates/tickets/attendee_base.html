{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Cue{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" as="style" onload="this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap"></noscript>
    <link rel="preload" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" as="style" onload="this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"></noscript>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <style>
        :root {
            --bg:            #0F0E0D;
            --surface:       #191817;
            --surface-2:     #232220;
            --surface-3:     #2D2C2A;
            --cta:           #EDE8E3;
            --text:          #FFFFFF;
            --text-2:        #E8E6E3;
            --text-3:        #C8C5C1;
            --danger:        #D97060;
            --success:       #6A9E7F;
            --border:        rgba(255,255,255,0.07);
            --border-mid:    rgba(255,255,255,0.11);
            --border-strong: rgba(255,255,255,0.16);
            --font-display:  'DM Sans', system-ui, sans-serif;
            --font-body:     'DM Sans', system-ui, sans-serif;
            --font-mono:     'DM Sans', system-ui, sans-serif;
            --radius:        3px;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--font-body);
            font-weight: 300;
            line-height: 1.55;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        {% include 'tickets/partials/_attendee_nav_css.html' %}

        /* Switch view banner (for organizers in attendee mode) */
        .switch-view-bar {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 8px 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-family: var(--font-mono);
            font-size: 0.72rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--text-3);
        }

        /* ── CONTENT WRAPPER ── */
        .attendee-wrap {
            max-width: 860px;
            margin: 0 auto;
            padding: 40px 24px 80px;
        }

        /* ── PAGE HEADER ── */
        .page-title {
            font-family: var(--font-display);
            font-weight: 800;
            font-size: 1.6rem;
            letter-spacing: -0.03em;
            line-height: 1.1;
            color: var(--text);
            margin-bottom: 6px;
        }
        .page-subtitle {
            font-size: 0.85rem;
            color: var(--text-2);
            margin-bottom: 32px;
        }

        /* ── SECTION LABEL ── */
        .section-label {
            font-family: var(--font-mono);
            font-size: 0.68rem;
            font-weight: 500;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--text-3);
            margin-bottom: 14px;
        }

        /* ── RULE ── */
        .rule {
            height: 1px;
            background: var(--border);
            margin: 28px 0;
        }

        /* ── CARD ── */
        .a-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
        }
        .a-card-header {
            padding: 14px 18px;
            border-bottom: 1px solid var(--border);
            font-family: var(--font-mono);
            font-size: 0.7rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--text-3);
        }
        .a-card-body {
            padding: 20px;
        }
        .a-card-body-flush {
            padding: 0;
        }

        /* ── EVENT CARD (grid) ── */
        .event-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 12px;
        }
        .event-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            text-decoration: none;
            color: inherit;
            transition: border-color 0.15s, transform 0.15s;
            animation: fadeUp 0.4s ease both;
        }
        .event-card:hover {
            border-color: var(--border-strong);
            transform: translateY(-2px);
        }
        .event-card-flyer {
            aspect-ratio: 4/5;
            overflow: hidden;
            background: var(--surface-2);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .event-card-flyer img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .event-card-flyer-placeholder {
            color: var(--text-3);
            font-size: 2rem;
        }
        .event-card-body {
            padding: 14px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .event-card-name {
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 0.95rem;
            letter-spacing: -0.01em;
            color: var(--text);
            margin-bottom: 6px;
        }
        .event-card-meta {
            font-family: var(--font-mono);
            font-size: 0.68rem;
            letter-spacing: 0.04em;
            color: var(--text-3);
            line-height: 1.7;
            flex: 1;
        }
        .event-card-cta {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            margin-top: 12px;
            background: var(--cta);
            color: var(--bg);
            border: none;
            border-radius: var(--radius);
            padding: 9px 14px;
            font-family: var(--font-mono);
            font-size: 0.72rem;
            font-weight: 500;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            text-decoration: none;
            cursor: pointer;
            transition: opacity 0.15s;
        }
        .event-card-cta:hover { opacity: 0.88; color: var(--bg); }

        /* ── TABLE ── */
        .a-table {
            width: 100%;
            border-collapse: collapse;
        }
        .a-table th {
            font-family: var(--font-mono);
            font-size: 0.67rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--text-3);
            padding: 10px 16px;
            border-bottom: 1px solid var(--border);
            text-align: left;
            font-weight: 400;
        }
        .a-table td {
            padding: 13px 16px;
            border-bottom: 1px solid var(--border);
            font-size: 0.88rem;
            color: var(--text-2);
            vertical-align: middle;
        }
        .a-table tbody tr:last-child td { border-bottom: none; }
        .a-table tbody tr {
            cursor: pointer;
            transition: background 0.12s;
        }
        .a-table tbody tr:hover { background: rgba(255,255,255,0.025); }

        /* ── TABS ── */
        .a-tabs {
            display: flex;
            gap: 2px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 24px;
        }
        .a-tab {
            font-family: var(--font-mono);
            font-size: 0.72rem;
            letter-spacing: 0.07em;
            text-transform: uppercase;
            color: var(--text-3);
            text-decoration: none;
            padding: 10px 14px;
            border-bottom: 2px solid transparent;
            margin-bottom: -1px;
            transition: color 0.15s, border-color 0.15s;
        }
        .a-tab:hover { color: var(--text-2); }
        .a-tab.active { color: var(--text); border-bottom-color: var(--cta); }

        /* ── BADGE ── */
        .a-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-family: var(--font-mono);
            font-size: 0.67rem;
            letter-spacing: 0.07em;
            text-transform: uppercase;
            padding: 3px 8px;
            border-radius: 2px;
        }
        .a-badge--success { background: rgba(106,158,127,0.15); color: var(--success); }
        .a-badge--danger  { background: rgba(217,112,96,0.15);  color: var(--danger); }
        .a-badge--muted   { background: rgba(255,255,255,0.06); color: var(--text-3); }

        /* ── BACK LINK ── */
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: var(--font-mono);
            font-size: 0.72rem;
            letter-spacing: 0.07em;
            text-transform: uppercase;
            color: var(--text-3);
            text-decoration: none;
            margin-bottom: 20px;
            transition: color 0.15s;
        }
        .back-link:hover { color: var(--text-2); }

        /* ── DETAIL TABLE ── */
        .detail-row {
            display: flex;
            padding: 11px 0;
            border-bottom: 1px solid var(--border);
            gap: 16px;
        }
        .detail-row:last-child { border-bottom: none; }
        .detail-label {
            font-family: var(--font-mono);
            font-size: 0.7rem;
            letter-spacing: 0.07em;
            text-transform: uppercase;
            color: var(--text-3);
            min-width: 130px;
            padding-top: 1px;
        }
        .detail-value {
            font-size: 0.88rem;
            color: var(--text-2);
        }

        /* ── QR CARD ── */
        .qr-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 28px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        .qr-card img {
            display: block;
            width: 200px;
            height: 200px;
            border-radius: 4px;
        }
        .qr-note {
            font-family: var(--font-mono);
            font-size: 0.68rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--text-3);
            margin-top: 14px;
        }

        /* ── EMPTY STATE ── */
        .empty-state {
            text-align: center;
            padding: 64px 24px;
            color: var(--text-3);
        }
        .empty-state i {
            font-size: 2.5rem;
            margin-bottom: 16px;
            display: block;
        }
        .empty-state p {
            font-size: 0.9rem;
            margin-bottom: 20px;
            color: var(--text-2);
        }

        /* ── PAGINATION ── */
        .a-pagination {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-top: 28px;
        }
        .a-page-btn {
            font-family: var(--font-mono);
            font-size: 0.72rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--text-2);
            text-decoration: none;
            padding: 7px 13px;
            border: 1px solid var(--border-mid);
            border-radius: var(--radius);
            transition: border-color 0.15s, color 0.15s;
        }
        .a-page-btn:hover { border-color: var(--border-strong); color: var(--text); }
        .a-page-btn.disabled { opacity: 0.4; pointer-events: none; }
        .a-page-info {
            font-family: var(--font-mono);
            font-size: 0.7rem;
            letter-spacing: 0.05em;
            color: var(--text-3);
            padding: 0 4px;
        }

        /* ── TOASTIFY ── */
        .toastify { width: min(360px, calc(100vw - 32px)); }

        /* ── VENUE LINK ── */
        .venue-map-link {
            color: var(--text-2);
            text-decoration: none;
            display: inline-flex;
            align-items: flex-start;
            gap: 6px;
            font-size: 0.85rem;
            transition: color 0.15s;
        }
        .venue-map-link:hover { color: var(--text); }
        .venue-map-link i { margin-top: 2px; flex-shrink: 0; }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ── RESPONSIVE ── */
        @media (max-width: 640px) {
            .attendee-wrap {
                padding: 20px 16px 56px;
            }
            .page-title { font-size: 1.35rem; }
            .page-subtitle { margin-bottom: 20px; }

            .detail-row { flex-direction: column; gap: 4px; }
            .detail-label { min-width: unset; }

            .qr-card img { width: 160px; height: 160px; }

            .a-table th,
            .a-table td { padding: 10px 12px; }
        }
    </style>
    {% block extra_head %}{% endblock %}
    <script async defer src="https://tools.luckyorange.com/core/lo.js?site-id=b8f766b4"></script>
</head>
<body>

{% include 'tickets/partials/_attendee_nav.html' %}

<div class="attendee-wrap">
    {% block content %}{% endblock %}
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {
    window.showCueToast = function (text, type, opts) {
        var palette = {
            success: { bg: 'rgba(106,158,127,0.18)', border: '#6A9E7F' },
            error:   { bg: 'rgba(217,112,96,0.18)',  border: '#D97060' },
            warning: { bg: 'rgba(201,147,58,0.18)',  border: '#c9933a' },
            info:    { bg: 'rgba(0,255,135,0.10)',   border: '#00FF87' },
            nudge:   { bg: 'rgba(0,255,135,0.10)',   border: '#00FF87' },
        };
        var s = palette[type] || palette.info;
        var isMobile = window.matchMedia('(max-width: 767px)').matches;
        Toastify(Object.assign({
            duration: (type === 'error' || type === 'warning') ? 7000 : 4500,
            gravity: 'bottom',
            position: isMobile ? 'center' : 'right',
            stopOnFocus: true,
            close: true,
            style: {
                background: s.bg,
                borderTop: '1px solid rgba(255,255,255,0.08)',
                borderRight: '1px solid rgba(255,255,255,0.08)',
                borderBottom: '1px solid rgba(255,255,255,0.08)',
                borderLeft: '3px solid ' + s.border,
                color: '#EDE8E3',
                fontFamily: "'DM Sans', system-ui, sans-serif",
                fontSize: '0.875rem',
                borderRadius: '3px',
                padding: '12px 16px',
                boxShadow: '0 8px 24px rgba(0,0,0,0.4)',
            },
        }, opts || {}, { text: text })).showToast();
    };
    {% if messages %}
    {% for message in messages %}
    window.showCueToast("{{ message|escapejs }}", "{% if 'error' in message.tags %}error{% elif 'success' in message.tags %}success{% elif 'warning' in message.tags %}warning{% else %}info{% endif %}");
    {% endfor %}
    {% endif %}
});
</script>

{% block extra_js %}{% endblock %}
{% block modals %}{% endblock %}
</body>
</html>
