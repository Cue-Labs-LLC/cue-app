{% extends 'tickets/base.html' %}

{% block title %}Become an Organizer - Eventflow{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-body p-5 text-center">
                <i class="bi bi-briefcase display-4 text-primary mb-3 d-block"></i>
                <h2 class="card-title mb-2">Become an Organizer</h2>
                <p class="text-muted mb-4">
                    Create and manage events, upload ticket data, and access analytics for your organization.
                </p>
                <a href="{% url 'tickets:create_organization' %}" class="btn btn-primary btn-lg">
                    Create your organization
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
