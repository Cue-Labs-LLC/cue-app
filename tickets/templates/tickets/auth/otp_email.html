<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
</head>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: #f5f5f5; margin: 0; padding: 20px;">
    <div style="max-width: 480px; margin: 0 auto; background: #ffffff; border-radius: 8px; padding: 40px; text-align: center;">
        <h2 style="margin: 0 0 8px; color: #1a1a2e;">Cue</h2>
        <p style="color: #666; margin: 0 0 32px;">Email Verification</p>

        <p style="color: #333; margin: 0 0 24px;">Your verification code is:</p>

        <div style="font-size: 36px; font-weight: 700; letter-spacing: 8px; color: #1a1a2e; background: #f0f0f5; border-radius: 8px; padding: 16px; margin: 0 0 24px; font-family: monospace;">
            {{ otp_code }}
        </div>

        <p style="color: #999; font-size: 14px; margin: 0;">
            This code expires in {{ expiry_minutes }} minutes.<br>
            If you did not request this code, you can safely ignore this email.
        </p>
    </div>
</body>
</html>
