{% extends 'tickets/auth/auth_base.html' %}
{% load crispy_forms_tags %}

{% block title %}Verify Email{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow">
            <div class="card-body p-5">
                <h2 class="card-title text-center mb-2">
                    <i class="bi bi-envelope-check"></i> Verify your email
                </h2>
                <p class="text-center text-muted mb-4">
                    We sent a 6-digit code to <strong>{{ masked_email }}</strong>
                </p>

                <form method="post">
                    {% csrf_token %}
                    {% crispy form %}
                </form>

                <div class="d-flex justify-content-between align-items-center mt-4">
                    <a href="{% url 'tickets:complete_profile' %}" class="text-decoration-none">
                        <i class="bi bi-arrow-left"></i> Back
                    </a>
                    <form method="post" action="{% url 'tickets:resend_email_after_profile' %}" class="d-inline">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-link text-decoration-none p-0">
                            <i class="bi bi-arrow-clockwise"></i> Resend code
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
