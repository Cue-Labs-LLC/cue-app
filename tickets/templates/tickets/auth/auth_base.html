{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Cue{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%230F0E0D'/%3E%3Cpath d='M6 11a1 1 0 0 1 1-1h18a1 1 0 0 1 1 1v3a2 2 0 0 0 0 4v3a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1v-3a2 2 0 0 0 0-4v-3z' fill='%2300FF87'/%3E%3Cline x1='13' y1='10' x2='13' y2='22' stroke='%230F0E0D' stroke-width='1.5' stroke-dasharray='2 2'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" as="style" onload="this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap"></noscript>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <link rel="preload" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" as="style" onload="this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"></noscript>
    <style>
        :root {
            --bg:            #0F0E0D;
            --surface:       #191817;
            --surface-2:     #232220;
            --surface-3:     #2D2C2A;
            --cta:           #EDE8E3;
            --text:          #EDE8E3;
            --text-2:        #9E9A96;
            --text-3:        #4A4846;
            --danger:        #D97060;
            --success:       #6A9E7F;
            --border:        rgba(255,255,255,0.07);
            --border-mid:    rgba(255,255,255,0.11);
            --border-strong: rgba(255,255,255,0.16);
            --font-display:  'DM Sans', system-ui, sans-serif;
            --font-body:     'DM Sans', system-ui, sans-serif;
            --font-mono:     'DM Sans', system-ui, sans-serif;
            --radius:        3px;
        }

        *, *::before, *::after { box-sizing: border-box; }

        html { scroll-behavior: smooth; height: 100%; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--font-body);
            font-weight: 300;
            line-height: 1.6;
            height: 100dvh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            display: flex;
            flex-direction: column;
        }

        /* ── NAV ── */
        .auth-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 clamp(20px, 4vw, 48px);
            height: 52px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .auth-brand {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: var(--text);
        }
        .auth-brand-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #00FF87;
            flex-shrink: 0;
            box-shadow: 0 0 8px rgba(0, 255, 135, 0.22);
        }
        .auth-brand-name {
            font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif;
            font-weight: 900;
            font-size: 1.5rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            line-height: 1;
        }

        .auth-nav-link {
            font-size: 0.8rem;
            color: var(--text-2);
            text-decoration: none;
            transition: color 0.15s;
        }
        .auth-nav-link:hover { color: var(--text); }

        /* ── MAIN ── */
        .auth-main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: clamp(12px, 3vh, 48px) clamp(20px, 4vw, 48px);
            overflow-y: auto;
        }

        .auth-wrap {
            width: 100%;
            max-width: 440px;
        }

        /* ── CARD - override Bootstrap ── */
        .auth-wrap .card {
            background: var(--surface);
            border: 1px solid var(--border-mid);
            border-radius: calc(var(--radius) + 2px);
            box-shadow: none;
        }

        .auth-wrap .card-body {
            padding: 2.25rem 2rem !important;
        }

        .auth-wrap .card-title {
            font-family: var(--font-display);
            font-weight: 800;
            font-size: 1.25rem;
            letter-spacing: 0.02em;
            color: var(--text);
            margin-bottom: 0;
        }

        .auth-wrap .text-muted {
            color: var(--text-2) !important;
        }

        /* ── FORM CONTROLS ── */
        .auth-wrap .form-label {
            font-family: var(--font-mono);
            font-size: 0.68rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--text);
            margin-bottom: 6px;
        }

        .auth-wrap .form-control,
        .auth-wrap .form-select {
            background: var(--surface-2);
            border: 1px solid var(--border-mid);
            color: var(--text);
            border-radius: var(--radius);
            font-family: var(--font-body);
            font-size: 0.9rem;
            font-weight: 300;
            padding: 10px 13px;
            transition: border-color 0.18s, box-shadow 0.18s;
        }

        .auth-wrap .form-control:focus,
        .auth-wrap .form-select:focus {
            background: var(--surface-2);
            border-color: var(--border-strong);
            color: var(--text);
            box-shadow: 0 0 0 3px rgba(237, 232, 227, 0.05);
            outline: none;
        }

        .auth-wrap .form-control::placeholder {
            color: var(--text-3);
        }

        .auth-wrap .form-text {
            font-size: 0.78rem;
            color: var(--text-2);
        }

        .auth-wrap .form-control.is-invalid,
        .auth-wrap .form-select.is-invalid {
            border-color: rgba(217, 112, 96, 0.5) !important;
            background-image: none !important;
        }

        .auth-wrap .form-control.is-invalid:focus {
            box-shadow: 0 0 0 3px rgba(217, 112, 96, 0.08) !important;
        }

        .auth-wrap .invalid-feedback,
        .auth-wrap .invalid-feedback strong {
            font-family: var(--font-mono);
            font-size: 0.67rem;
            letter-spacing: 0.04em;
            color: #e05c4a;
        }

        .auth-wrap .form-check-label {
            color: var(--text);
            font-size: 0.88rem;
        }

        .auth-wrap .mb-3 { margin-bottom: 1rem !important; }

        /* ── BUTTONS ── */
        .auth-wrap .btn-primary {
            background: var(--cta);
            border-color: var(--cta);
            color: var(--bg);
            font-family: var(--font-mono);
            font-size: 0.73rem;
            font-weight: 500;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            border-radius: var(--radius);
            padding: 11px 20px;
            transition: opacity 0.15s, transform 0.1s;
        }
        .auth-wrap .btn-primary:hover {
            background: #d8d3ce;
            border-color: #d8d3ce;
            color: var(--bg);
            opacity: 0.95;
        }
        .auth-wrap .btn-primary:active { transform: scale(0.98); }

        .auth-wrap .btn-link {
            color: var(--text-2);
            font-size: 0.85rem;
            text-decoration: none;
            padding: 0;
        }
        .auth-wrap .btn-link:hover { color: var(--text); }

        .auth-wrap a.text-decoration-none {
            color: var(--text-2);
            font-size: 0.85rem;
            transition: color 0.15s;
        }
        .auth-wrap a.text-decoration-none:hover { color: var(--text); }

        /* ── ALERTS ── */
        .auth-wrap .alert {
            font-size: 0.85rem;
            border-radius: var(--radius);
            padding: 10px 14px;
        }
        .auth-wrap .alert-danger,
        .auth-wrap .alert-error {
            background: rgba(217, 112, 96, 0.18);
            border-left: 3px solid #d97060;
            border-color: rgba(217, 112, 96, 0.55);
            color: #f0a090;
            font-weight: 500;
        }
        .auth-wrap .alert-success {
            background: rgba(106, 158, 127, 0.1);
            border-color: rgba(106, 158, 127, 0.25);
            color: #80b596;
        }
        .auth-wrap .alert-warning {
            background: rgba(200, 169, 126, 0.1);
            border-color: rgba(200, 169, 126, 0.25);
            color: #c8a97e;
        }
        .auth-wrap .alert-info {
            background: rgba(100, 140, 200, 0.1);
            border-color: rgba(100, 140, 200, 0.25);
            color: #8aabdb;
        }

        /* ── ICON COLORS ── */
        .text-success { color: var(--success) !important; }
        .text-danger  { color: var(--danger) !important; }

        /* ── NEUTRALIZE GRID WRAPPERS (children use .row > .col-md-*) ── */
        .auth-wrap .row {
            --bs-gutter-x: 0;
            display: block;
        }
        .auth-wrap [class*="col-"] {
            width: 100%;
            max-width: 100%;
            flex: none;
            padding: 0;
        }

        /* ── MISC ── */
        .auth-wrap .small { font-size: 0.8rem; }
        .auth-wrap strong { font-weight: 500; color: var(--text); }

        /* ── BELOW-CARD LINKS ── */
        .auth-below {
            margin-top: 18px;
            text-align: center;
        }
        .auth-below a {
            color: var(--text-2);
            font-size: 0.82rem;
            text-decoration: none;
            display: block;
            margin-bottom: 6px;
            transition: color 0.15s;
        }
        .auth-below a:hover { color: var(--text); }

        /* ── TOASTIFY ── */
        .toastify { width: min(360px, calc(100vw - 32px)); }
    </style>
    {% block extra_head %}{% endblock %}
    <style>
        /* ── intl-tel-input integration (auth pages) ─── */
        .iti { width: 100%; }
        .iti__selected-flag:focus { outline: none; }
        .iti__selected-flag:focus-visible {
            box-shadow: 0 0 0 0.25rem rgba(0, 255, 135, 0.15);
        }
        .iti:has(.is-invalid) {
            border: 1px solid var(--danger);
            border-radius: var(--radius);
        }
        /* Bootstrap's invalid-feedback is a sibling of .is-invalid, but intl-tel-input
           wraps the input in .iti — so the feedback div ends up as a sibling of .iti,
           not the input. This rule makes it visible in that structure. */
        .iti:has(.is-invalid) ~ .invalid-feedback {
            display: block;
        }
        /* Auth pages are always dark — no data-theme conditional needed */
        .iti__selected-flag {
            background: #232220;
            border-color: rgba(255,255,255,0.11);
        }
        .iti__selected-flag:hover {
            background: #2D2C2A;
        }
        .iti__dropdown-content,
        .iti__country-list {
            background: #191817;
            border: 1px solid rgba(255,255,255,0.11);
            border-radius: 4px;
            color: #EDE8E3;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        .iti__search-input {
            background: #232220;
            border-color: rgba(255,255,255,0.11);
            color: #EDE8E3;
        }
        .iti__search-input::placeholder { color: #9E9A96; }
        .iti__country:hover,
        .iti__country--highlight {
            background: #232220;
        }
        .iti__divider {
            border-color: rgba(255,255,255,0.07);
        }
        .iti__dial-code { color: #9E9A96; }
        .iti__country-name { color: #EDE8E3; }
    </style>
    <script async defer src="https://tools.luckyorange.com/core/lo.js?site-id=b8f766b4"></script>
</head>
<body>

    <nav class="auth-nav">
        <a href="/" class="auth-brand">
            <span class="auth-brand-dot"></span>
            <span class="auth-brand-name">Cue</span>
        </a>
        {% if browse_events_enabled %}<a href="{% url 'tickets:explore' %}" class="auth-nav-link">Browse events</a>{% endif %}
    </nav>

    <main class="auth-main">
        <div class="auth-wrap">
            {% block content %}{% endblock %}
        </div>
    </main>

<script>
document.addEventListener('DOMContentLoaded', function () {
    window.showCueToast = function (text, type, opts) {
        var palette = {
            success: { bg: 'rgba(106,158,127,0.18)', border: '#6A9E7F' },
            error:   { bg: 'rgba(217,112,96,0.18)',  border: '#D97060' },
            warning: { bg: 'rgba(201,147,58,0.18)',  border: '#c9933a' },
            info:    { bg: 'rgba(0,255,135,0.10)',   border: '#00FF87' },
            nudge:   { bg: 'rgba(0,255,135,0.10)',   border: '#00FF87' },
        };
        var s = palette[type] || palette.info;
        var isMobile = window.matchMedia('(max-width: 767px)').matches;
        Toastify(Object.assign({
            duration: (type === 'error' || type === 'warning') ? 7000 : 4500,
            gravity: 'bottom',
            position: isMobile ? 'center' : 'right',
            stopOnFocus: true,
            close: true,
            style: {
                background: s.bg,
                borderTop: '1px solid rgba(255,255,255,0.08)',
                borderRight: '1px solid rgba(255,255,255,0.08)',
                borderBottom: '1px solid rgba(255,255,255,0.08)',
                borderLeft: '3px solid ' + s.border,
                color: '#EDE8E3',
                fontFamily: "'DM Sans', system-ui, sans-serif",
                fontSize: '0.875rem',
                borderRadius: '3px',
                padding: '12px 16px',
                boxShadow: '0 8px 24px rgba(0,0,0,0.4)',
            },
        }, opts || {}, { text: text })).showToast();
    };
    {% if messages %}
    {% for message in messages %}
    window.showCueToast("{{ message|escapejs }}", "{% if 'error' in message.tags %}error{% elif 'success' in message.tags %}success{% elif 'warning' in message.tags %}warning{% else %}info{% endif %}");
    {% endfor %}
    {% endif %}
});
</script>
{% block extra_js %}{% endblock %}
</body>
</html>
