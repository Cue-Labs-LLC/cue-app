{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Cue{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap" as="style" onload="this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap"></noscript>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preload" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" as="style" onload="this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"></noscript>
    <style>
        :root {
            --bg:            #0F0E0D;
            --surface:       #191817;
            --surface-2:     #232220;
            --surface-3:     #2D2C2A;
            --cta:           #EDE8E3;
            --text:          #EDE8E3;
            --text-2:        #7A7672;
            --text-3:        #4A4846;
            --danger:        #D97060;
            --success:       #6A9E7F;
            --border:        rgba(255,255,255,0.07);
            --border-mid:    rgba(255,255,255,0.11);
            --border-strong: rgba(255,255,255,0.16);
            --font-display:  'Syne', system-ui, sans-serif;
            --font-body:     'DM Sans', system-ui, sans-serif;
            --font-mono:     'DM Mono', 'Courier New', monospace;
            --radius:        3px;
        }

        *, *::before, *::after { box-sizing: border-box; }

        html { scroll-behavior: smooth; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--font-body);
            font-weight: 300;
            line-height: 1.6;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            display: flex;
            flex-direction: column;
        }

        /* ── NAV ── */
        .auth-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 clamp(20px, 4vw, 48px);
            height: 52px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .auth-brand {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: var(--text);
        }
        .auth-brand-icon {
            width: 26px;
            height: 26px;
            background: var(--cta);
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--bg);
            font-size: 13px;
        }
        .auth-brand-name {
            font-family: var(--font-display);
            font-weight: 800;
            font-size: 1rem;
            letter-spacing: -0.02em;
        }

        .auth-nav-link {
            font-size: 0.8rem;
            color: var(--text-2);
            text-decoration: none;
            transition: color 0.15s;
        }
        .auth-nav-link:hover { color: var(--text); }

        /* ── MAIN ── */
        .auth-main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 48px clamp(20px, 4vw, 48px);
        }

        .auth-wrap {
            width: 100%;
            max-width: 440px;
        }

        /* ── CARD — override Bootstrap ── */
        .auth-wrap .card {
            background: var(--surface);
            border: 1px solid var(--border-mid);
            border-radius: calc(var(--radius) + 2px);
            box-shadow: none;
        }

        .auth-wrap .card-body {
            padding: 2.25rem 2rem !important;
        }

        .auth-wrap .card-title {
            font-family: var(--font-display);
            font-weight: 800;
            font-size: 1.25rem;
            letter-spacing: -0.02em;
            color: var(--text);
            margin-bottom: 0;
        }

        .auth-wrap .text-muted {
            color: var(--text-2) !important;
        }

        /* ── FORM CONTROLS ── */
        .auth-wrap .form-label {
            font-family: var(--font-mono);
            font-size: 0.68rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--text-2);
            margin-bottom: 6px;
        }

        .auth-wrap .form-control,
        .auth-wrap .form-select {
            background: var(--surface-2);
            border: 1px solid var(--border-mid);
            color: var(--text);
            border-radius: var(--radius);
            font-family: var(--font-body);
            font-size: 0.9rem;
            font-weight: 300;
            padding: 10px 13px;
            transition: border-color 0.18s, box-shadow 0.18s;
        }

        .auth-wrap .form-control:focus,
        .auth-wrap .form-select:focus {
            background: var(--surface-2);
            border-color: var(--border-strong);
            color: var(--text);
            box-shadow: 0 0 0 3px rgba(237, 232, 227, 0.05);
            outline: none;
        }

        .auth-wrap .form-control::placeholder {
            color: var(--text-3);
        }

        .auth-wrap .form-text {
            font-size: 0.78rem;
            color: var(--text-3);
        }

        .auth-wrap .form-control.is-invalid,
        .auth-wrap .form-select.is-invalid {
            border-color: rgba(217, 112, 96, 0.5) !important;
            background-image: none !important;
        }

        .auth-wrap .form-control.is-invalid:focus {
            box-shadow: 0 0 0 3px rgba(217, 112, 96, 0.08) !important;
        }

        .auth-wrap .invalid-feedback {
            font-family: var(--font-mono);
            font-size: 0.67rem;
            letter-spacing: 0.04em;
            color: var(--danger);
        }

        .auth-wrap .mb-3 { margin-bottom: 1rem !important; }

        /* ── BUTTONS ── */
        .auth-wrap .btn-primary {
            background: var(--cta);
            border-color: var(--cta);
            color: var(--bg);
            font-family: var(--font-mono);
            font-size: 0.73rem;
            font-weight: 500;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            border-radius: var(--radius);
            padding: 11px 20px;
            transition: opacity 0.15s, transform 0.1s;
        }
        .auth-wrap .btn-primary:hover {
            background: #d8d3ce;
            border-color: #d8d3ce;
            color: var(--bg);
            opacity: 0.95;
        }
        .auth-wrap .btn-primary:active { transform: scale(0.98); }

        .auth-wrap .btn-link {
            color: var(--text-2);
            font-size: 0.85rem;
            text-decoration: none;
            padding: 0;
        }
        .auth-wrap .btn-link:hover { color: var(--text); }

        .auth-wrap a.text-decoration-none {
            color: var(--text-2);
            font-size: 0.85rem;
            transition: color 0.15s;
        }
        .auth-wrap a.text-decoration-none:hover { color: var(--text); }

        /* ── ALERTS ── */
        .auth-wrap .alert {
            font-size: 0.85rem;
            border-radius: var(--radius);
            padding: 10px 14px;
        }
        .auth-wrap .alert-danger {
            background: rgba(217, 112, 96, 0.1);
            border-color: rgba(217, 112, 96, 0.25);
            color: #e8907f;
        }
        .auth-wrap .alert-success {
            background: rgba(106, 158, 127, 0.1);
            border-color: rgba(106, 158, 127, 0.25);
            color: #80b596;
        }
        .auth-wrap .alert-warning {
            background: rgba(200, 169, 126, 0.1);
            border-color: rgba(200, 169, 126, 0.25);
            color: #c8a97e;
        }
        .auth-wrap .alert-info {
            background: rgba(100, 140, 200, 0.1);
            border-color: rgba(100, 140, 200, 0.25);
            color: #8aabdb;
        }

        /* ── ICON COLORS ── */
        .text-success { color: var(--success) !important; }
        .text-danger  { color: var(--danger) !important; }

        /* ── NEUTRALIZE GRID WRAPPERS (children use .row > .col-md-*) ── */
        .auth-wrap .row {
            --bs-gutter-x: 0;
            display: block;
        }
        .auth-wrap [class*="col-"] {
            width: 100%;
            max-width: 100%;
            flex: none;
            padding: 0;
        }

        /* ── MISC ── */
        .auth-wrap .small { font-size: 0.8rem; }
        .auth-wrap strong { font-weight: 500; color: var(--text); }

        /* ── BELOW-CARD LINKS ── */
        .auth-below {
            margin-top: 18px;
            text-align: center;
        }
        .auth-below a {
            color: var(--text-2);
            font-size: 0.82rem;
            text-decoration: none;
            display: block;
            margin-bottom: 6px;
            transition: color 0.15s;
        }
        .auth-below a:hover { color: var(--text); }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>

    <nav class="auth-nav">
        <a href="/" class="auth-brand">
            <span class="auth-brand-icon">
                <i class="bi bi-lightning-charge-fill"></i>
            </span>
            <span class="auth-brand-name">Cue</span>
        </a>
        <a href="{% url 'tickets:explore' %}" class="auth-nav-link">Browse events</a>
    </nav>

    <main class="auth-main">
        <div class="auth-wrap">
            {% block content %}{% endblock %}
        </div>
    </main>

</body>
</html>
