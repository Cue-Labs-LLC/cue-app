{% extends 'tickets/auth/auth_base.html' %}

{% block title %}Logged Out {% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow">
            <div class="card-body p-5 text-center">
                <h2 class="card-title mb-4">
                    <i class="bi bi-box-arrow-right text-success"></i> Logged Out
                </h2>
                <p class="text-muted">You have been successfully logged out.</p>
                <a href="{% url 'tickets:login' %}" class="btn btn-primary">
                    <i class="bi bi-box-arrow-in-right"></i> Login Again
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
