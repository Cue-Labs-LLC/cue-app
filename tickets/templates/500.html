<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23EDE8E3'/%3E%3Cpath d='M10 16l4 4 8-8' stroke='%230F0E0D' stroke-width='3' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E">
    <title>500 - Server Error · Cue</title>
    <!-- Fonts loaded with system fallbacks - self-contained for reliability on 500 errors -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;1,9..40,300&family=DM+Mono:wght@300;400&display=swap" as="style" onload="this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;1,9..40,300&family=DM+Mono:wght@300;400&display=swap"></noscript>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg:         #0F0E0D;
            --surface:    #191817;
            --border:     rgba(255,255,255,0.07);
            --border-mid: rgba(255,255,255,0.11);
            --text:       #EDE8E3;
            --text-2:     #7A7672;
            --text-3:     #4A4846;
            --cta:        #EDE8E3;
            --warning:    #C49A3C;
            --font-display: 'Syne', system-ui, sans-serif;
            --font-body:    'DM Sans', system-ui, sans-serif;
            --font-mono:    'DM Mono', 'Courier New', monospace;
        }

        html, body { height: 100%; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--font-body);
            font-weight: 300;
            -webkit-font-smoothing: antialiased;
            display: flex;
            flex-direction: column;
        }

        .e-nav {
            display: flex;
            align-items: center;
            padding: 0 clamp(20px, 4vw, 48px);
            height: 52px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        .e-brand {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: var(--text);
        }
        .e-brand-icon {
            width: 26px;
            height: 26px;
            background: var(--cta);
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--bg);
            font-size: 13px;
        }
        .e-brand-name {
            font-family: var(--font-display);
            font-weight: 800;
            font-size: 1rem;
            letter-spacing: -0.02em;
        }

        .e-main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: clamp(32px, 6vh, 80px) clamp(20px, 4vw, 48px);
            position: relative;
            overflow: hidden;
        }

        .e-ghost {
            position: absolute;
            font-family: var(--font-mono);
            font-weight: 400;
            font-size: clamp(160px, 28vw, 320px);
            color: rgba(196, 154, 60, 0.04);
            letter-spacing: -0.05em;
            user-select: none;
            pointer-events: none;
            line-height: 1;
        }

        .e-content {
            position: relative;
            max-width: 480px;
            width: 100%;
        }

        .e-code {
            font-family: var(--font-mono);
            font-size: 0.7rem;
            font-weight: 400;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--text-3);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .e-code::before {
            content: '';
            display: block;
            width: 24px;
            height: 1px;
            background: var(--text-3);
        }

        .e-title {
            font-family: var(--font-display);
            font-weight: 800;
            font-size: clamp(1.75rem, 4vw, 2.5rem);
            letter-spacing: -0.03em;
            line-height: 1.1;
            color: var(--text);
            margin-bottom: 16px;
        }

        .e-body {
            font-size: 0.9rem;
            color: var(--text-2);
            line-height: 1.65;
            margin-bottom: 36px;
        }

        .e-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .e-btn {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            font-family: var(--font-mono);
            font-size: 0.72rem;
            font-weight: 400;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            text-decoration: none;
            padding: 11px 20px;
            border-radius: 3px;
            border: 1px solid transparent;
            cursor: pointer;
            transition: opacity 0.15s, transform 0.1s;
        }
        .e-btn:active { transform: scale(0.98); }

        .e-btn--primary {
            background: var(--cta);
            border-color: var(--cta);
            color: var(--bg);
        }
        .e-btn--primary:hover { opacity: 0.88; }

        .e-btn--ghost {
            background: transparent;
            border-color: var(--border-mid);
            color: var(--text-2);
        }
        .e-btn--ghost:hover { color: var(--text); border-color: rgba(255,255,255,0.2); }
    </style>
</head>
<body>

<nav class="e-nav">
    <a href="/" class="e-brand">
        <span class="e-brand-icon">&#9889;</span>
        <span class="e-brand-name">Cue</span>
    </a>
</nav>

<main class="e-main">
    <span class="e-ghost">500</span>
    <div class="e-content">
        <p class="e-code">Error 500</p>
        <h1 class="e-title">Something went wrong</h1>
        <p class="e-body">An unexpected error occurred on our end. It's been logged and we'll look into it. Try refreshing the page - if it keeps happening, come back in a few minutes.</p>
        <div class="e-actions">
            <a href="javascript:location.reload()" class="e-btn e-btn--primary">Refresh page</a>
            <a href="/" class="e-btn e-btn--ghost">Go to dashboard</a>
        </div>
    </div>
</main>

</body>
</html>
